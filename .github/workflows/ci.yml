name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  queue: max

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Types, tests, build and isolated Table Storage smoke tests
        run: npm run verify
      - name: Build Linux container
        run: docker build --platform linux/amd64 --tag wichteln:ci .

  infrastructure:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflow
        run: |
          # actionlint does not yet recognize GitHub's concurrency queue field.
          grep -A2 '^concurrency:$' .github/workflows/ci.yml | grep -Fxq '  queue: max'
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo \
            rhysd/actionlint:1.7.12 \
            -ignore 'unexpected key "queue" for "concurrency" section' \
            .github/workflows/ci.yml
      - name: Compile Bicep templates and parameters
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem infra -Filter *.bicep) {
            az bicep build --file $file.FullName --stdout | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Compilation failed: $file" }
          }
          az bicep build-params --file infra/main.bicepparam --stdout | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Parameter compilation failed' }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'infra/deploy.ps1'), [ref]$null, [ref]$errors
          ) | Out-Null
          if ($errors.Count) { throw ($errors.Message -join "`n") }

  deploy:
    name: Deploy production
    needs: [application, infrastructure]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: rg-wichteln
      NAME_PREFIX: wichteln
      IMAGE_REPOSITORY: wichteln
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate OIDC configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          : "${CLIENT_ID:?Set repository variable AZURE_CLIENT_ID}"
          : "${TENANT_ID:?Set repository variable AZURE_TENANT_ID}"
          : "${AZURE_SUBSCRIPTION_ID:?Set repository variable AZURE_SUBSCRIPTION_ID}"
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Discover existing deployment
        id: resources
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp show --name "$NAME_PREFIX-app" \
            --resource-group "$RESOURCE_GROUP" --subscription "$AZURE_SUBSCRIPTION_ID" \
            --output json > "$RUNNER_TEMP/app.json"
          server=$(jq -er '.properties.configuration.registries[0].server' "$RUNNER_TEMP/app.json")
          registry=${server%%.*}
          fqdn=$(jq -er '.properties.configuration.ingress.fqdn' "$RUNNER_TEMP/app.json")
          {
            echo "registry=$registry"
            echo "server=$server"
            echo "url=https://$fqdn"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push immutable image
        id: image
        env:
          REGISTRY: ${{ steps.resources.outputs.registry }}
          LOGIN_SERVER: ${{ steps.resources.outputs.server }}
        run: |
          tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          image="$LOGIN_SERVER/$IMAGE_REPOSITORY:$tag"
          az acr login --name "$REGISTRY" --subscription "$AZURE_SUBSCRIPTION_ID"
          docker build --platform linux/amd64 --tag "$image" .
          docker push "$image"
          digest=$(az acr repository show --name "$REGISTRY" \
            --image "$IMAGE_REPOSITORY:$tag" --subscription "$AZURE_SUBSCRIPTION_ID" \
            --query digest --output tsv)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid image digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy app and maintenance job
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          jq --arg prefix "$NAME_PREFIX" --arg repository "$IMAGE_REPOSITORY" \
            --arg digest "$DIGEST" '
            . as $app |
            ($app.identity.userAssignedIdentities | to_entries |
              if length == 1 then .[0] else error("Expected one runtime identity") end) as $identity |
            ($app.properties.template.containers[] | select(.name == "wichteln") |
              .env | map({key: .name, value: .value}) | from_entries) as $env |
            {
              location: $app.location,
              namePrefix: $prefix,
              tags: ($app.tags // {}),
              environmentId: $app.properties.managedEnvironmentId,
              identityId: $identity.key,
              identityClientId: $identity.value.clientId,
              tableEndpoint: $env.TABLE_ENDPOINT,
              registryServer: $app.properties.configuration.registries[0].server,
              imageRepository: $repository,
              imageTag: $digest,
              publicUrl: ($env.PUBLIC_URL // ""),
              minReplicas: 1,
              maxReplicas: ($app.properties.template.scale.maxReplicas // 2)
            } | map_values({value: .}) |
            { "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
              contentVersion: "1.0.0.0", parameters: . }
          ' "$RUNNER_TEMP/app.json" > "$RUNNER_TEMP/workloads.parameters.json"
          az deployment group create --name "github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --resource-group "$RESOURCE_GROUP" --subscription "$AZURE_SUBSCRIPTION_ID" \
            --template-file infra/workloads.bicep \
            --parameters @"$RUNNER_TEMP/workloads.parameters.json" --output none
      - name: Verify ready revision, scheduled job and public health
        env:
          APP_URL: ${{ steps.resources.outputs.url }}
          LOGIN_SERVER: ${{ steps.resources.outputs.server }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          image="$LOGIN_SERVER/$IMAGE_REPOSITORY@$DIGEST"
          ready=false
          for attempt in {1..30}; do
            az containerapp show --name "$NAME_PREFIX-app" \
              --resource-group "$RESOURCE_GROUP" --subscription "$AZURE_SUBSCRIPTION_ID" \
              --output json > "$RUNNER_TEMP/deployed.json"
            if jq -e --arg image "$image" '
              .properties.provisioningState == "Succeeded" and
              .properties.latestRevisionName == .properties.latestReadyRevisionName and
              .properties.template.scale.minReplicas == 1 and
              .properties.template.containers[0].image == $image
            ' "$RUNNER_TEMP/deployed.json" > /dev/null; then
              ready=true
              break
            fi
            echo "Waiting for the deployed revision (attempt $attempt/30)"
            sleep 10
          done
          "$ready" || { echo "Deployed revision did not become ready" >&2; exit 1; }
          az containerapp job show --name "$NAME_PREFIX-maintenance" \
            --resource-group "$RESOURCE_GROUP" --subscription "$AZURE_SUBSCRIPTION_ID" \
            --output json | jq -e \
            --arg image "$image" '
              .properties.provisioningState == "Succeeded" and
              .properties.template.containers[0].image == $image
            '
          curl --fail --silent --show-error --retry 6 --retry-all-errors \
            --retry-delay 10 --max-time 30 "$APP_URL/api/health" | jq -e '.ok == true'
          curl --fail --silent --show-error --retry 3 --max-time 30 "$APP_URL/" > /dev/null
          {
            echo "Deployed $APP_URL"
            echo "Image digest: $DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
