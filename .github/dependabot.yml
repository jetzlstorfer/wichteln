version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: quarterly
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: quarterly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: quarterly
    groups:
      docker-images:
        patterns:
          - "*"
